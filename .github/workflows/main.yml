name: Build Website to APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Ссылка на ваш сайт (URL)'
        required: true
        default: 'https://perchance.org'
      app_name:
        description: 'Название приложения'
        required: true
        default: 'URV AI Chat'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Web Wrapper
        run: |
          mkdir -p dist
          echo '<script>window.location.href="${{ github.event.inputs.website_url }}";</script>' > dist/index.html
          npm install @capacitor/cli @capacitor/core @capacitor/android
          npx cap init "${{ github.event.inputs.app_name }}" com.urvaichat.app --web-dir=dist
          npx cap add android
          npx cap sync

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Ready-APK-File
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
